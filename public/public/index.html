<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>予約経路分析ダッシュボード</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen hidden">
  <div class="login-card">
    <div class="eyebrow">RESERVATION ANALYTICS</div>
    <h1>予約経路分析ダッシュボード</h1>
    <p class="muted">パスワードを入力してください</p>
    <input id="loginPassword" type="password" placeholder="パスワード" />
    <button id="loginSubmit" class="btn btn-primary">ログイン</button>
    <p id="loginError" class="error-text hidden">パスワードが違います</p>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">RESERVATION ANALYTICS</div>
      <h1>予約経路分析ダッシュボード</h1>
    </div>
    <nav class="tabs" id="mainTabs">
      <button class="tab-btn active" data-tab="dashboard">ダッシュボード</button>
      <button class="tab-btn" data-tab="import">CSV取込</button>
      <button class="tab-btn" data-tab="settings">設定</button>
    </nav>
    <div class="sync-status" id="syncStatus">&nbsp;</div>
  </header>

  <!-- ===================== ダッシュボード ===================== -->
  <section id="tab-dashboard" class="tab-panel active">
    <div class="filter-bar card">
      <div class="filter-field">
        <label>店舗</label>
        <select id="storeFilter" multiple size="6"></select>
        <button id="storeFilterAll" class="btn btn-ghost btn-sm">全店舗</button>
      </div>
      <div class="filter-field">
        <label>期間（開始月）</label>
        <input type="month" id="dateFromInput" />
      </div>
      <div class="filter-field">
        <label>期間（終了月）</label>
        <input type="month" id="dateToInput" />
